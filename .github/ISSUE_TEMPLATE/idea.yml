name: Idea
description: Propose a feature or product change for the backlog.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't the owner or their bots do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: A few sentences on what could solve it. Details belong in the feature specification.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, parity rows, prior art, or links.
